<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORES HV — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script>try{var o=new URLSearchParams(location.search).get("open");if(o)localStorage.setItem("mhv.open",o);}catch(e){}</script>
<script>
  try { document.documentElement.dataset.level = localStorage.getItem("erp.termLevel") || "high"; } catch (_) {}
</script>
<link rel="stylesheet" href="/static/terminal.css">
<style>
/* MORES HV sign-in - the terminal theme (terminal.css) plus the form. */
h1 {
  font-family: var(--term); font-weight: 400; text-align: center; line-height: 1.05;
  font-size: clamp(34px, 5vw, 64px); letter-spacing: .04em; color: var(--ink); margin-bottom: clamp(26px, 4vw, 48px);
}
.sub { font-size: clamp(12px, 1.05vw, 14px); letter-spacing: .18em; text-transform: uppercase; color: var(--soft);
  margin: calc(-1 * clamp(14px, 2.6vw, 34px)) 0 clamp(22px, 3vw, 36px); text-align: center; }
form { width: min(520px, 100%); display: flex; flex-direction: column; }
label.cap { display: block; font-weight: 600; font-size: clamp(13px, 1.1vw, 15px); letter-spacing: .06em; color: var(--ink); margin: 0 0 8px; }
label.cap small { font-weight: 500; color: var(--soft); letter-spacing: .04em; margin-left: 8px; }
.field { display: flex; align-items: stretch; border: 1px solid var(--line); background: var(--field); margin-bottom: 22px;
  box-shadow: inset 0 0 18px rgba(0,0,0,.6); }
.field:focus-within { border-color: var(--ink); box-shadow: inset 0 0 18px rgba(0,0,0,.6), 0 0 0 1px var(--ink); }
.field .pr { display: flex; align-items: center; padding-left: 12px; color: var(--soft); font-weight: 600; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); caret-color: var(--ink);
  font-family: var(--mono); font-weight: 500; font-size: clamp(15px, 1.25vw, 18px); letter-spacing: .06em; padding: 12px; min-height: 48px; }
.field input::placeholder { color: var(--dim); opacity: 1; }
.peek { border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 0 14px; min-width: 64px; }
.peek:hover, .peek:focus-visible { background: var(--ink); color: var(--screen); outline: 0; }
.opts { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: -6px 0 22px; }
.opts label { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; letter-spacing: .08em; color: var(--ink); text-transform: uppercase; }
.opts input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border: 1px solid var(--ink); background: var(--field);
  display: inline-grid; place-content: center; cursor: pointer; margin: 0; }
.opts input[type=checkbox]::before { content: ""; width: 10px; height: 10px; background: var(--ink); transform: scale(0); }
.opts input[type=checkbox]:checked::before { transform: scale(1); }
.opts input[type=checkbox]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); font: 600 13px var(--mono);
  letter-spacing: .08em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
.linkbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.msg { margin-bottom: 18px; padding: 10px 12px; border: 1px solid currentColor; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }
.msg::before { content: "> "; }
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#00a2b6">
<link rel="icon" type="image/png" href="/static/pwa/icon-192.png">
<link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png">
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
</head>
<body>
<div class="crt">
  <div class="top">
    <a class="brand" href="/" aria-label="MORES Strategics home"><img src="/static/assets/mores-logo-ondark.png" alt="MORES Strategics"></a>
    <div class="right">
      <div class="level" role="group" aria-label="Display level">
        <button type="button" data-level="low">Low</button>
        <button type="button" data-level="high">High</button>
      </div>
      <span class="glow" id="clock">--/--/---- --:--:--</span>
    </div>
  </div>

  <main class="stage">
    <h1 class="glow"><span data-type>Welcome to MORES HV</span><span class="cur">_</span></h1>
    <p class="sub">Helicopter View &middot; Group Finance</p>

    <form id="loginForm" autocomplete="on" novalidate>
      <div id="loginMsg" class="msg bad" role="alert" hidden></div>

      <label class="cap glow" for="username">Employee ID:<small>username or e-mail</small></label>
      <div class="field">
        <span class="pr" aria-hidden="true">&gt;</span>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="name@mores.id" required autofocus spellcheck="false">
      </div>

      <label class="cap glow" for="password">Password:</label>
      <div class="field">
        <span class="pr" aria-hidden="true">&gt;</span>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="********" required>
        <button type="button" class="peek" id="peek" aria-label="Show password">Show</button>
      </div>

      <div class="opts">
        <label><input type="checkbox" id="remember"> Remember this desk</label>
        <button type="button" class="linkbtn" id="forgot">Forgot?</button>
      </div>

      <button type="submit" class="go" id="submitBtn"><span id="cta">Login</span></button>
    </form>
  </main>

  <div class="foot">
    <div><b>Audentes fortuna iuvat</b> &mdash; fortune favors the brave</div>
    <div class="mid glow" id="version">Version 1.12b &middot; updated 4 November 2026</div>
    <div class="end">Made by Uncle Sam &mdash; With Love</div>
  </div>
</div>

<script src="/static/terminal.js"></script>
<script>
const $ = id => document.getElementById(id);

const pw = $("password"), peek = $("peek");
peek.onclick = () => {
  const showing = pw.type === "text";
  pw.type = showing ? "password" : "text";
  peek.textContent = showing ? "Show" : "Hide";
  peek.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  pw.focus();
};

function say(text, ok) {
  const m = $("loginMsg");
  m.textContent = text; m.className = "msg " + (ok ? "ok" : "bad"); m.hidden = false;
}
$("forgot").onclick = () => say("Password resets are manual - ask your system administrator.", true);

const form = $("loginForm"), btn = $("submitBtn"), cta = $("cta");
form.addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").hidden = true;
  if (!$("username").value.trim() || !pw.value) { say("Enter your Employee ID and password."); return; }
  btn.disabled = true; cta.textContent = "Authenticating...";
  try {
    const res = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value, password: pw.value, remember: $("remember").checked }),
    });
    if (res.ok) { cta.textContent = "Access granted"; say("Access granted. Opening the database select...", true); location.href = "/databases"; return; }
    const data = await res.json().catch(() => ({}));
    say(data.error || "Login failed");
  } catch (_) {
    say("Cannot reach the server");
  }
  btn.disabled = false; cta.textContent = "Login";
});
</script>
</body>
</html>
